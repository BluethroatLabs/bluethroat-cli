[project]
name = "bluethroat"
version = "0.1.0"
description = "Command-line client for BlueSkills"
readme = "README.md"
authors = [
    { name = "iamwehi", email = "iamwehi@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "keyring>=25",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
bluethroat = "bluethroat.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
