[project]
name = "bluethroat"
version = "0.1.4"
description = "Command-line client for BlueSkills, BlueGate, BluePaper, BlueExif, and BlueMask"
readme = "README.md"
authors = [
    { name = "iamwehi", email = "iamwehi@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "keyring>=25",
    "lxml>=6.1.3",
    "mutagen>=1.48.1",
    "piexif>=1.1.3",
    "pikepdf>=10.18.0",
    "pillow>=13.0.0",
    "pymediainfo>=7.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
bluethroat = "bluethroat.cli:main"

[project.urls]
Homepage = "https://blueskills.bluethroatlabs.com"
Documentation = "https://blueskills.bluethroatlabs.com/for-agents"
Source = "https://github.com/BluethroatLabs/bluethroat-cli"
Issues = "https://github.com/BluethroatLabs/bluethroat-cli/issues"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
